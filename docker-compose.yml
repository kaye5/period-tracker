# Local dev database (DEC-011). MySQL 8, bound to 127.0.0.1 only — never exposed beyond
# this machine. `pnpm db:up` / `pnpm db:down` / `pnpm db:reset` drive this (package.json).
#
# Credentials default to the values baked into .env.example's local-Docker DATABASE_URL
# (mysql://app:app_password@127.0.0.1:3306/period_tracker); override via .env.local if
# you want different ones — pnpm db:up passes --env-file .env.local.
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-period_tracker}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - period_tracker_mysql_data:/var/lib/mysql
      # Runs once on a fresh volume: creates the separate period_tracker_test database
      # the destructive integration tests use (see scripts/mysql-init/01-create-test-db.sql
      # and lib/repo/testUtils.ts). Re-created by `pnpm db:reset` (which recreates the volume).
      - ./scripts/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  period_tracker_mysql_data:
